<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админка КЛЕВЕР</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f6f3ee;color:#35543d}
.wrap{max-width:1100px;margin:auto;padding:24px}
.panel{background:#fff;border-radius:20px;padding:22px;box-shadow:0 8px 28px rgba(0,0,0,.06);margin-bottom:20px}
h1,h2{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
label{display:grid;gap:6px;font-weight:600}
input,textarea,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}
textarea{min-height:100px;resize:vertical}
button{border:0;border-radius:10px;padding:12px 18px;background:#35543d;color:#fff;cursor:pointer;font-weight:700}
.secondary{background:#d8a8b5}
.danger{background:#b84d57}
.muted{color:#6c7a70}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.product{display:grid;grid-template-columns:100px 1fr auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid #eee}
.product img{width:100px;height:100px;object-fit:cover;border-radius:14px;background:#eee}
.login{max-width:420px;margin:80px auto}
.hidden{display:none!important}
.status{margin-top:12px;font-weight:700}
.order{padding:14px 0;border-bottom:1px solid #eee}
.photo-section{margin-top:18px;padding:18px;border:1px solid #e7e1da;border-radius:16px;background:#fbfaf8}
.photo-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.photo-upload{display:inline-flex;align-items:center;gap:10px;padding:12px 18px;border-radius:10px;background:#35543d;color:#fff;cursor:pointer;font-weight:700}
.photo-upload input{display:none}
.photo-count{font-weight:700;color:#6c7a70}
.photo-list{display:grid;grid-template-columns:repeat(auto-fill,280px);gap:16px;margin-top:16px;justify-content:start}
.photo-editor{width:280px}
.photo-editor{padding:12px;border:1px solid #ddd5ce;border-radius:16px;background:#fff}
.photo-editor.dragging{opacity:.45}
.photo-editor.drag-over{outline:3px solid #d8a8b5}
.photo-drag{margin-bottom:9px;color:#6c7a70;font-size:13px;cursor:grab;user-select:none}
.crop-window{position:relative;overflow:hidden;aspect-ratio:1/1;border-radius:13px;background:#eee9e3;touch-action:none;cursor:grab}
.crop-window:active{cursor:grabbing}
.crop-window img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:cover;pointer-events:none;user-select:none;transform-origin:center}
.main-badge{position:absolute;top:9px;left:9px;z-index:2;padding:6px 9px;border-radius:999px;background:#fff;color:#35543d;font-size:12px;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.zoom-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;margin-top:11px;font-size:13px}
.zoom-row input{padding:0}
.photo-actions{display:flex;gap:8px;margin-top:10px}
.photo-actions button{flex:1;padding:9px 8px;font-size:13px}
.empty-photos{margin:16px 0 0;color:#6c7a70}
@media(max-width:700px){
  .grid{grid-template-columns:1fr}
  .product{grid-template-columns:72px 1fr}
  .product img{width:72px;height:72px}
  .product .actions{grid-column:1/-1}
}
</style>
</head>

<body>
<div class="wrap">

  <section id="login-panel" class="panel login">
    <h1>Вход в админку</h1>

    <label>
      Логин
      <input id="login-user" value="admin">
    </label>

    <label>
      Пароль
      <input id="login-password" type="password">
    </label>

    <button onclick="doLogin()">Войти</button>

    <div id="login-status" class="status"></div>
  </section>

  <main id="admin-panel" class="hidden">

    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:14px">
        <h1>Админка КЛЕВЕР</h1>
        <button class="secondary" onclick="logout()">Выйти</button>
      </div>

      <p class="muted">
        Добавляйте товары и загружайте фотографии.
        Изменения сразу появляются в каталоге.
      </p>
    </div>

    <section class="panel">
      <h2 id="form-title">Добавить товар</h2>

      <input id="product-id" type="hidden">

      <div class="grid">
        <label>
          Название
          <input id="name">
        </label>

        <label>
          Цена, ₽
          <input id="price" type="number" min="1">
        </label>

        <label>
          Категория
          <input id="category" value="Букеты">
        </label>

        <label>
          Порядок показа
          <input id="sort-order" type="number" value="0">
        </label>
      </div>

      <section class="photo-section">
        <div class="photo-toolbar">
          <div>
            <strong>Фотографии товара</strong>
            <div class="muted">
              До 5 фото. Двигайте фото прямо в рамке для кадрирования.
            </div>
          </div>

          <label class="photo-upload">
            + Добавить фото
            <input id="image-files" type="file" accept="image/*" multiple>
          </label>

          <span class="photo-count" id="photo-count">0 из 5</span>
        </div>

        <div class="photo-list" id="photo-list"></div>
      </section>

      <label>
        Краткое описание
        <input id="short-description">
      </label>

      <label>
        Описание
        <textarea id="description"></textarea>
      </label>

      <label>
        Состав
        <textarea id="composition"></textarea>
      </label>

      <div class="grid">
        <label>
          Ширина, см
          <input id="size-width" type="number" min="1" placeholder="40">
        </label>

        <label>
          Высота, см
          <input id="size-height" type="number" min="1" placeholder="45">
        </label>
      </div>

      <label>
        Уход
        <textarea id="care"></textarea>
      </label>

      <label style="display:flex;grid-template-columns:auto 1fr;align-items:center;margin-top:12px">
        <input id="visible" type="checkbox" checked style="width:auto">
        Показывать товар на сайте
      </label>

      <div class="actions">
        <button onclick="saveProduct()">Сохранить товар</button>
                    <button
              id="cancel-edit"
              class="secondary hidden"
              onclick="resetForm()"
            >
              Отменить редактирование
            </button>
          </div>

          <div id="product-status" class="status"></div>
        </section>

        <section class="panel">
          <h2>Товары</h2>
          <div id="products-list"></div>
        </section>

        <section class="panel">
          <h2>Заказы</h2>
          <div id="orders-list"></div>
        </section>

      </main>
    </div>

    <script>
    let products = [];
    let productPhotos = [];
    let draggedPhotoIndex = null;

    const $ = id => document.getElementById(id);

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatPrice(value) {
      return `${Number(value || 0).toLocaleString("ru-RU")} ₽`;
    }

    function showStatus(elementId, message, isError = false) {
      const element = $(elementId);

      element.textContent = message;
      element.style.color = isError ? "#b84d57" : "#35543d";
    }

    async function api(url, options = {}) {
      const response = await fetch(url, {
        credentials: "same-origin",
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.error || "Произошла ошибка");
      }

      return data;
    }

    async function checkLogin() {
      try {
        const data = await api("/api/me");

        if (data.isAdmin) {
          $("login-panel").classList.add("hidden");
          $("admin-panel").classList.remove("hidden");

          await Promise.all([
            loadProducts(),
            loadOrders()
          ]);
        } else {
          $("login-panel").classList.remove("hidden");
          $("admin-panel").classList.add("hidden");
        }
      } catch (error) {
        showStatus(
          "login-status",
          error.message,
          true
        );
      }
    }

    async function doLogin() {
      showStatus("login-status", "Входим...");

      try {
        await api("/api/login", {
          method: "POST",
          body: JSON.stringify({
            username: $("login-user").value,
            password: $("login-password").value
          })
        });

        $("login-password").value = "";
        await checkLogin();
      } catch (error) {
        showStatus(
          "login-status",
          error.message,
          true
        );
      }
    }

    async function logout() {
      try {
        await api("/api/logout", {
          method: "POST"
        });
      } finally {
        location.reload();
      }
    }

    function parseSize(size) {
      const numbers = String(size || "").match(/\d+(?:[.,]\d+)?/g) || [];

      return {
        width: numbers[0] || "",
        height: numbers[1] || ""
      };
    }

    function buildSize() {
      const width = $("size-width").value.trim();
      const height = $("size-height").value.trim();

      if (width && height) {
        return `${width} × ${height} см`;
      }

      if (width) {
        return `${width} см`;
      }

      if (height) {
        return `${height} см`;
      }

      return "";
    }

    function normalizePhotos(images, legacyImage = "") {
      const source = Array.isArray(images) ? images : [];

      let result = source.slice(0, 5).map((item, index) => ({
        image: String(item.image || ""),
        is_main: Boolean(item.is_main),
        sort_order: index,
        zoom: Number(item.zoom) || 1,
        pos_x: Number(item.pos_x) || 0,
        pos_y: Number(item.pos_y) || 0
      })).filter(item => item.image);

      if (!result.length && legacyImage) {
        result = [{
          image: legacyImage,
          is_main: true,
          sort_order: 0,
          zoom: 1,
          pos_x: 0,
          pos_y: 0
        }];
      }

      if (result.length && !result.some(item => item.is_main)) {
        result[0].is_main = true;
      }

      return result;
    }

    function setMainPhoto(index) {
      productPhotos.forEach((photo, photoIndex) => {
        photo.is_main = photoIndex === index;
      });

      renderPhotoEditors();
    }

    function removePhoto(index) {
      const wasMain = productPhotos[index]?.is_main;

      productPhotos.splice(index, 1);

      if (
        productPhotos.length &&
        (wasMain || !productPhotos.some(photo => photo.is_main))
      ) {
        productPhotos[0].is_main = true;
      }

      renderPhotoEditors();
    }

    function movePhoto(fromIndex, toIndex) {
      if (
        fromIndex === toIndex ||
        fromIndex < 0 ||
        toIndex < 0 ||
        fromIndex >= productPhotos.length ||
        toIndex >= productPhotos.length
      ) {
        return;
      }

      const [photo] = productPhotos.splice(fromIndex, 1);
      productPhotos.splice(toIndex, 0, photo);

      productPhotos.forEach((item, index) => {
        item.sort_order = index;
      });

      renderPhotoEditors();
    }

    function renderPhotoEditors() {
      const list = $("photo-list");
      $("photo-count").textContent = `${productPhotos.length} из 5`;

      if (!productPhotos.length) {
        list.innerHTML = `
          <p class="empty-photos">
            Фотографии ещё не добавлены.
          </p>
        `;

        return;
      }

      list.innerHTML = productPhotos.map((photo, index) => `
        <article
          class="photo-editor"
          draggable="true"
          data-photo-index="${index}"
        >
          <div class="photo-drag">
            Перетащите карточку, чтобы изменить порядок
          </div>

          <div
            class="crop-window"
            data-crop-index="${index}"
          >
            ${photo.is_main
              ? '<span class="main-badge">Главное фото</span>'
              : ""}

            <img
              src="${escapeHtml(photo.image)}"
              alt=""
              style="
                transform:
                  translate(${photo.pos_x}%, ${photo.pos_y}%)
                  scale(${photo.zoom});
              "
            >
          </div>

          <label class="zoom-row">
            <span>Масштаб</span>

            <input
              type="range"
              min="1"
              max="2.5"
              step="0.01"
              value="${photo.zoom}"
              data-zoom-index="${index}"
            >

            <span>${Number(photo.zoom).toFixed(2)}</span>
          </label>

          <div class="photo-actions">
            <button
              type="button"
              class="secondary"
              onclick="setMainPhoto(${index})"
            >
              Сделать главным
            </button>

            <button
              type="button"
              class="danger"
              onclick="removePhoto(${index})"
            >
              Удалить
            </button>
          </div>
        </article>
      `).join("");

      bindPhotoEditorEvents();
    }
      function bindPhotoEditorEvents() {
  document.querySelectorAll("[data-zoom-index]").forEach(input => {
    input.addEventListener("input", event => {
      const index = Number(event.target.dataset.zoomIndex);
      const photo = productPhotos[index];

      if (!photo) return;

      photo.zoom = Number(event.target.value);

      const editor = event.target.closest(".photo-editor");
      const image = editor.querySelector(".crop-window img");
      const valueLabel = event.target.nextElementSibling;

      image.style.transform = `
        translate(${photo.pos_x}%, ${photo.pos_y}%)
        scale(${photo.zoom})
      `;

      valueLabel.textContent = photo.zoom.toFixed(2);
    });
  });

  document.querySelectorAll("[data-crop-index]").forEach(crop => {
    let startX = 0;
    let startY = 0;
    let startPosX = 0;
    let startPosY = 0;
    let moving = false;

    crop.addEventListener("pointerdown", event => {
      const index = Number(crop.dataset.cropIndex);
      const photo = productPhotos[index];

      if (!photo) return;

      moving = true;
      startX = event.clientX;
      startY = event.clientY;
      startPosX = photo.pos_x;
      startPosY = photo.pos_y;

      crop.setPointerCapture(event.pointerId);
      event.preventDefault();
    });

    crop.addEventListener("pointermove", event => {
      if (!moving) return;

      const index = Number(crop.dataset.cropIndex);
      const photo = productPhotos[index];

      if (!photo) return;

      const rect = crop.getBoundingClientRect();

      const deltaX =
        ((event.clientX - startX) / rect.width) * 100;

      const deltaY =
        ((event.clientY - startY) / rect.height) * 100;

      photo.pos_x = Math.max(
        -50,
        Math.min(50, startPosX + deltaX)
      );

      photo.pos_y = Math.max(
        -50,
        Math.min(50, startPosY + deltaY)
      );

      const image = crop.querySelector("img");

      image.style.transform = `
        translate(${photo.pos_x}%, ${photo.pos_y}%)
        scale(${photo.zoom})
      `;
    });

    const stopMoving = event => {
      if (!moving) return;

      moving = false;

      if (crop.hasPointerCapture(event.pointerId)) {
        crop.releasePointerCapture(event.pointerId);
      }
    };

    crop.addEventListener("pointerup", stopMoving);
    crop.addEventListener("pointercancel", stopMoving);
  });

  document.querySelectorAll(".photo-editor").forEach(editor => {
    editor.addEventListener("dragstart", event => {
      draggedPhotoIndex = Number(
        editor.dataset.photoIndex
      );

      editor.classList.add("dragging");

      event.dataTransfer.effectAllowed = "move";
    });

    editor.addEventListener("dragend", () => {
      draggedPhotoIndex = null;
      editor.classList.remove("dragging");

      document
        .querySelectorAll(".photo-editor")
        .forEach(item => {
          item.classList.remove("drag-over");
        });
    });

    editor.addEventListener("dragover", event => {
      event.preventDefault();
      editor.classList.add("drag-over");
    });

    editor.addEventListener("dragleave", () => {
      editor.classList.remove("drag-over");
    });

    editor.addEventListener("drop", event => {
      event.preventDefault();
      editor.classList.remove("drag-over");

      const targetIndex = Number(
        editor.dataset.photoIndex
      );

      if (draggedPhotoIndex !== null) {
        movePhoto(draggedPhotoIndex, targetIndex);
      }
    });
  });
}

async function uploadPhoto(file) {
  const formData = new FormData();
  formData.append("image", file);

  const response = await fetch("/api/admin/upload", {
    method: "POST",
    credentials: "same-origin",
    body: formData
  });

  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(
      data.error || "Не удалось загрузить фото"
    );
  }

  return data.url;
}

$("image-files").addEventListener("change", async event => {
  const files = [...event.target.files];
  const freePlaces = 5 - productPhotos.length;

  if (!freePlaces) {
    showStatus(
      "product-status",
      "Можно добавить не больше 5 фотографий",
      true
    );

    event.target.value = "";
    return;
  }

  const selectedFiles = files.slice(0, freePlaces);

  showStatus(
    "product-status",
    `Загружаем фото: ${selectedFiles.length}...`
  );

  try {
    for (const file of selectedFiles) {
      const url = await uploadPhoto(file);

      productPhotos.push({
        image: url,
        is_main: productPhotos.length === 0,
        sort_order: productPhotos.length,
        zoom: 1,
        pos_x: 0,
        pos_y: 0
      });

      renderPhotoEditors();
    }

    showStatus(
      "product-status",
      "Фотографии загружены"
    );
  } catch (error) {
    showStatus(
      "product-status",
      error.message,
      true
    );
  } finally {
    event.target.value = "";
  }
});

async function loadProducts() {
  try {
    products = await api("/api/admin/products");
    renderProducts();
  } catch (error) {
    $("products-list").innerHTML = `
      <p style="color:#b84d57">
        ${escapeHtml(error.message)}
      </p>
    `;
  }
}

function renderProducts() {
  const list = $("products-list");

  if (!products.length) {
    list.innerHTML = "<p>Товаров пока нет.</p>";
    return;
  }

  list.innerHTML = products.map(product => {
    const mainImage =
      product.images?.find(image => image.is_main)?.image ||
      product.image ||
      "";

    return `
      <article class="product">
        ${mainImage
          ? `
            <img
              src="${escapeHtml(mainImage)}"
              alt="${escapeHtml(product.name)}"
            >
          `
          : "<div></div>"}

        <div>
          <strong>${escapeHtml(product.name)}</strong>

          <div>${formatPrice(product.price)}</div>

          <div class="muted">
            ${escapeHtml(product.category || "Букеты")}
            ·
            ${product.visible ? "показывается" : "скрыт"}
            ·
            фото: ${product.images?.length || (product.image ? 1 : 0)}
          </div>
        </div>

        <div class="actions">
          <button
            class="secondary"
            onclick="editProduct(${product.id})"
          >
            Изменить
          </button>

          <button
            class="danger"
            onclick="deleteProduct(${product.id})"
          >
            Удалить
          </button>
        </div>
      </article>
    `;
  }).join("");
}

function editProduct(id) {
  const product = products.find(
    item => Number(item.id) === Number(id)
  );

  if (!product) return;

  const size = parseSize(product.size);

  $("product-id").value = product.id;
  $("name").value = product.name || "";
  $("price").value = product.price || "";
  $("category").value = product.category || "Букеты";
  $("sort-order").value = product.sort_order || 0;

  $("short-description").value =
    product.short_description || "";

  $("description").value = product.description || "";
  $("composition").value = product.composition || "";
  $("size-width").value = size.width;
  $("size-height").value = size.height;
  $("care").value = product.care || "";
  $("visible").checked = Boolean(product.visible);

  productPhotos = normalizePhotos(
    product.images,
    product.image
  );

  renderPhotoEditors();

  $("form-title").textContent = "Редактировать товар";
  $("cancel-edit").classList.remove("hidden");

  showStatus("product-status", "");

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

function resetForm() {
  $("product-id").value = "";
  $("name").value = "";
  $("price").value = "";
  $("category").value = "Букеты";
  $("sort-order").value = "0";
  $("short-description").value = "";
  $("description").value = "";
  $("composition").value = "";
  $("size-width").value = "";
  $("size-height").value = "";
  $("care").value = "";
  $("visible").checked = true;

  productPhotos = [];
  renderPhotoEditors();

  $("form-title").textContent = "Добавить товар";
  $("cancel-edit").classList.add("hidden");

  showStatus("product-status", "");
}
      async function saveProduct() {
  const id = $("product-id").value;

  const payload = {
    name: $("name").value.trim(),
    price: Number($("price").value),
    category: $("category").value.trim() || "Букеты",
    sort_order: Number($("sort-order").value) || 0,
    short_description: $("short-description").value.trim(),
    description: $("description").value.trim(),
    composition: $("composition").value.trim(),
    size: buildSize(),
    care: $("care").value.trim(),
    visible: $("visible").checked,
    images: productPhotos.map((photo, index) => ({
      image: photo.image,
      is_main: Boolean(photo.is_main),
      sort_order: index,
      zoom: Number(photo.zoom) || 1,
      pos_x: Number(photo.pos_x) || 0,
      pos_y: Number(photo.pos_y) || 0
    }))
  };

  if (!payload.name || !payload.price) {
    showStatus(
      "product-status",
      "Укажите название и цену",
      true
    );
    return;
  }

  showStatus("product-status", "Сохраняем...");

  try {
    await api(
      id
        ? `/api/admin/products/${id}`
        : "/api/admin/products",
      {
        method: id ? "PUT" : "POST",
        body: JSON.stringify(payload)
      }
    );

    resetForm();
    await loadProducts();

    showStatus(
      "product-status",
      id
        ? "Товар изменён"
        : "Товар добавлен"
    );
  } catch (error) {
    showStatus(
      "product-status",
      error.message,
      true
    );
  }
}

async function deleteProduct(id) {
  const product = products.find(
    item => Number(item.id) === Number(id)
  );

  if (!confirm(
    `Удалить товар «${product?.name || ""}»?`
  )) {
    return;
  }

  try {
    await api(`/api/admin/products/${id}`, {
      method: "DELETE"
    });

    if (
      Number($("product-id").value) === Number(id)
    ) {
      resetForm();
    }

    await loadProducts();
  } catch (error) {
    alert(error.message);
  }
}

async function loadOrders() {
  try {
    const orders = await api("/api/admin/orders");
    renderOrders(orders);
  } catch (error) {
    $("orders-list").innerHTML = `
      <p style="color:#b84d57">
        ${escapeHtml(error.message)}
      </p>
    `;
  }
}

function renderOrders(orders) {
  const list = $("orders-list");

  if (!orders.length) {
    list.innerHTML = "<p>Заказов пока нет.</p>";
    return;
  }

  const statuses = [
    "Новый",
    "Принят",
    "В работе",
    "Готов",
    "Доставлен",
    "Завершён",
    "Отменён"
  ];

  list.innerHTML = orders.map(order => {
    const items = Array.isArray(order.items)
      ? order.items
      : [];

    const itemsHtml = items.length
      ? `
        <ul>
          ${items.map(item => `
            <li>
              ${escapeHtml(item.name)}
              × ${Number(item.qty || 1)}
              ·
              ${formatPrice(
                Number(item.price || 0) *
                Number(item.qty || 1)
              )}
            </li>
          `).join("")}
        </ul>
      `
      : "<p class=\"muted\">Состав заказа не сохранён.</p>";

    return `
      <article class="order">
        <div
          style="
            display:flex;
            justify-content:space-between;
            gap:14px;
            flex-wrap:wrap;
          "
        >
          <div>
            <strong>Заказ №${order.id}</strong>

            <div class="muted">
              ${escapeHtml(
                order.created_at_formatted ||
                order.created_at ||
                "Дата не указана"
              )}
            </div>
          </div>

          <strong>${formatPrice(order.total)}</strong>
        </div>

        <p>
          <strong>Клиент:</strong>
          ${escapeHtml(order.customer_name)}
        </p>

        <p>
          <strong>Телефон:</strong>
          <a href="tel:${escapeHtml(order.phone)}">
            ${escapeHtml(order.phone)}
          </a>
        </p>

        ${itemsHtml}

        <p>
          <strong>Комментарий:</strong>
          ${order.comment
            ? escapeHtml(order.comment)
            : "Не указан"}
        </p>

        <label style="max-width:260px">
          Статус заказа

          <select
            onchange="
              updateOrderStatus(
                ${order.id},
                this.value,
                this
              )
            "
          >
            ${statuses.map(status => `
              <option
                value="${status}"
                ${status === order.status ? "selected" : ""}
              >
                ${status}
              </option>
            `).join("")}
          </select>
        </label>
        <button
  type="button"
  class="danger"
  onclick="deleteOrder(${order.id})"
>
  Удалить заказ
</button>      </article>
    `;
  }).join("");
}

async function updateOrderStatus(id, status, select) {
  select.disabled = true;

  try {
    await api(`/api/admin/orders/${id}/status`, {
      method: "PUT",
      body: JSON.stringify({ status })
    });
  } catch (error) {
    alert(error.message);
    await loadOrders();
  } finally {
    select.disabled = false;
  }
}
  async function deleteOrder(id) {
  const confirmed = confirm(
    "Удалить этот заказ?"
  );

  if (!confirmed) {
    return;
  }

  try {
    await api(`/api/admin/orders/${id}`, {
      method: "DELETE"
    });

    await loadOrders();
  } catch (error) {
    alert(error.message);
  }
}    

document
  .getElementById("login-password")
  .addEventListener("keydown", event => {
    if (event.key === "Enter") {
      doLogin();
    }
  });

renderPhotoEditors();
checkLogin();
</script>
